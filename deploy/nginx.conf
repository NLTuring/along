# Internal web tier. Publish behind a TLS reverse proxy; never expose API/DB/Redis directly.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 220m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        # Resource-ticket queries and private identifiers must not enter access logs.
        access_log off;
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering off;
        proxy_buffering off;
        # Preserve Origin and CSRF headers; backend checks an explicit origin allowlist.
    }
    location /admin/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control no-store;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control no-cache;
    }
    location ~ /\. { deny all; }
}
