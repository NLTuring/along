# Include INSIDE the EXISTING HTTPS server block for tokennext.top.
# Do not replace its server_name, certificate, root, or other location blocks.
# The trailing slash on proxy_pass strips /along/ before forwarding to the isolated Along web tier.
location = /along { return 308 /along/; }
location = /along/admin { return 308 /along/admin/; }
location ^~ /along/api/ {
    access_log off;
    client_max_body_size 100m;
    proxy_pass http://127.0.0.1:4338/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_read_timeout 180s;
    proxy_request_buffering off;
    proxy_buffering off;
    add_header Referrer-Policy no-referrer always;
}
location ^~ /along/ {
    proxy_pass http://127.0.0.1:4338/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
}
